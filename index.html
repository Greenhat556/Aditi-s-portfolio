<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Portfolio</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
    }

    .portfolio-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe
    class="portfolio-frame"
    src="https://www.canva.com/design/DAHNbRMb6V0/waPvnCaT8t5k27kdIGR8jA/view?embed"
    allowfullscreen="allowfullscreen"
    allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share; accelerometer; gyroscope"
    loading="eager"
    title="Portfolio">
  </iframe>

</body>
</html>
